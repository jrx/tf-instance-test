---
- name: Install pre-requisites
  ansible.builtin.import_playbook: test.yml

- name: Vault Agent with Podman Quadlet
  hosts: all
  serial: 1
  become: true

  vars:
    VAULT_ADDR: ""
    VAULT_NAMESPACE: ""

  tasks:

    # ── Vault Agent ──────────────────────────────────────────────────────

    - name: Ensure vault group exists
      group:
        name: vault
        system: yes

    - name: Ensure vault user exists
      user:
        name: vault
        system: yes
        group: vault

    - name: Ensure Vault configuration directory exists
      file:
        path: /etc/vault.d
        state: directory
        owner: vault
        group: vault
        mode: '0750'

    - name: Ensure Vault run directory exists
      file:
        path: /opt/vault
        state: directory
        owner: vault
        group: vault
        mode: '0750'

    - name: Create tmpfs mount point for secrets
      file:
        path: /run/vault-secrets
        state: directory
        owner: vault
        group: vault
        mode: '0750'

    - name: Mount tmpfs at /run/vault-secrets
      mount:
        path: /run/vault-secrets
        src: tmpfs
        fstype: tmpfs
        opts: "size=1m,noexec,nosuid,nodev,mode=0750,uid=vault,gid=vault"
        state: mounted

    - name: Create per-app secrets directory
      file:
        path: /run/vault-secrets/myapp
        state: directory
        owner: vault
        group: vault
        mode: '0755'

    - name: Download CA certificate from Vault server
      ansible.builtin.shell:
        cmd: >-
          openssl s_client -showcerts
          -connect {{ VAULT_ADDR | regex_replace('^https://', '') }}
          </dev/null 2>/dev/null |
          openssl x509 -outform PEM > /etc/vault.d/vault-ca.pem
      args:
        executable: /bin/bash

    - name: Transfer Vault Agent configuration
      template:
        src: ./files/vault-podman-agent.hcl.j2
        dest: /etc/vault.d/agent.hcl
        mode: 0640
        owner: vault
        group: vault

    - name: Transfer secret template (db_password)
      copy:
        src: ./files/db-password.tpl
        dest: /etc/vault.d/db-password.tpl
        mode: 0640
        owner: vault
        group: vault

    - name: Transfer secret template (api_key)
      copy:
        src: ./files/api-key.tpl
        dest: /etc/vault.d/api-key.tpl
        mode: 0640
        owner: vault
        group: vault

    - name: Transfer Vault Agent systemd service
      copy:
        src: ./files/vault-podman-agent.service
        dest: /etc/systemd/system/vault-agent.service
        owner: root
        group: root
        mode: '0644'

    # ── Podman Quadlet ───────────────────────────────────────────────────

    - name: Ensure Podman Quadlet directory exists
      file:
        path: /etc/containers/systemd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Transfer Podman Quadlet container unit
      copy:
        src: ./files/myapp.container
        dest: /etc/containers/systemd/myapp.container
        owner: root
        group: root
        mode: '0644'

    # ── Start services ───────────────────────────────────────────────────

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and start Vault Agent service
      systemd:
        name: vault-agent.service
        enabled: yes
        state: restarted

    - name: Enable and start Podman Quadlet container
      systemd:
        name: myapp.service
        enabled: yes
        state: restarted
